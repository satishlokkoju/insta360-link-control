[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "insta360-link-control"
version = "0.1.0"
description = "Control Insta360 Link and Link 2 webcams on Linux"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Satish Lokkoju" }]
keywords = ["webcam", "uvc", "v4l2", "ptz", "gimbal", "insta360"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/satishlokkoju/insta360_link_control"
Issues = "https://github.com/satishlokkoju/insta360_link_control/issues"

[project.scripts]
linkctl = "linkctl.cli:main"
link-control-gui = "linkctl.gui:main"

[tool.setuptools]
packages = ["linkctl"]

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#576375"/>
      <stop offset="1" stop-color="#232b38"/>
    </linearGradient>
    <linearGradient id="glass" x1="0.25" y1="0.05" x2="0.85" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.45" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aab6c6"/>
      <stop offset="1" stop-color="#6b7A8D"/>
    </linearGradient>
  </defs>

  <!-- stand: base, column, then the yoke cradling the camera -->
  <rect x="34" y="112" width="60" height="11" rx="5.5" fill="url(#metal)"/>
  <rect x="57" y="88" width="14" height="26" rx="4" fill="url(#metal)"/>
  <path d="M17 47 V70 A47 47 0 0 0 111 70 V47"
        fill="none" stroke="url(#metal)" stroke-width="10" stroke-linecap="round"/>

  <!-- camera head -->
  <rect x="26" y="12" width="76" height="70" rx="19" fill="url(#body)"/>
  <rect x="26" y="12" width="76" height="70" rx="19" fill="none"
        stroke="#0f172a" stroke-width="2" opacity="0.35"/>

  <!-- lens -->
  <circle cx="64" cy="47" r="26" fill="#0e1626"/>
  <circle cx="64" cy="47" r="20.5" fill="url(#glass)"/>
  <circle cx="64" cy="47" r="8" fill="#0b1220" opacity="0.9"/>
  <circle cx="55" cy="38" r="5.2" fill="#ffffff" opacity="0.8"/>

  <!-- yoke pivots -->
  <circle cx="17" cy="47" r="7" fill="url(#metal)"/>
  <circle cx="111" cy="47" r="7" fill="url(#metal)"/>

  <!-- tally light -->
  <circle cx="90" cy="22" r="4" fill="#f87171"/>
</svg>
